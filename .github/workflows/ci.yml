name: CI

on:
  push:
    branches: [main]
    # Pushing a tag like v0.1.0 also publishes a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --path . --import
      - name: Run tests
        run: |
          godot --headless --path . -s tests/run_tests.gd 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if grep -q "SCRIPT ERROR" test.log; then
            echo "Script errors during the test run"
            exit 1
          fi
          exit $status
        shell: bash

  gameboy:
    name: Game Boy ROMs
    runs-on: ubuntu-latest
    env:
      RGBDS_VERSION: 0.6.1
      GBDK_VERSION: 4.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot, RGBDS, GBDK and PyBoy
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tools/rgbds"
          cd "$RUNNER_TEMP/tools"
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          # rgb2sdas, which turns hUGEDriver into a GBDK library, reads the
          # object format of RGBDS 0.6.
          curl -sSL "https://github.com/gbdev/rgbds/releases/download/v${RGBDS_VERSION}/rgbds-${RGBDS_VERSION}-linux-x86_64.tar.xz" | tar -xJ -C rgbds
          curl -sSL "https://github.com/gbdk-2020/gbdk-2020/releases/download/${GBDK_VERSION}/gbdk-linux64.tar.gz" | tar -xz
          echo "$RUNNER_TEMP/tools" >> $GITHUB_PATH
          echo "$RUNNER_TEMP/tools/rgbds" >> $GITHUB_PATH
          echo "GBDK_HOME=$RUNNER_TEMP/tools/gbdk" >> $GITHUB_ENV
          pip install --quiet pyboy numpy
      - name: Build hUGEDriver
        run: bash tools/build_hugedriver.sh "$GBDK_HOME"
      - name: Export example projects
        run: |
          godot --headless --path . --import < /dev/null
          godot --headless --path . -s tools/gb_examples.gd -- "$PWD/gb_examples" < /dev/null
      - name: Build ROMs
        run: |
          set -e
          for dir in gb_examples/*/; do
            make -C "$dir" GBDK_HOME="$GBDK_HOME"
          done
          ls -l gb_examples/*/*.gb
      - name: Play ROMs in an emulator
        run: |
          set -e
          for rom in gb_examples/song_*/*.gb; do
            python3 tools/gb_smoke.py "$rom" 8
          done
          # The kit example plays the chosen sound on A.
          python3 tools/gb_smoke.py gb_examples/kit/*.gb 5 a,down,a,down,a
      - uses: actions/upload-artifact@v4
        with:
          name: hugedriver-lib
          path: assets/gameboy/hUGEDriver/lib/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gameboy-example-roms
          path: |
            gb_examples/*/*.gb
            gb_examples/*/src/

  nes:
    name: NES projects in FamiStudio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and FamiStudio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tools/famistudio"
          cd "$RUNNER_TEMP/tools"
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          echo "$RUNNER_TEMP/tools" >> $GITHUB_PATH
          # The exported projects carry no FamiStudio version, so any current
          # release reads them; test against the latest one.
          gh release view --repo BleuBleu/FamiStudio --json tagName,assets --jq '.tagName, .assets[].name'
          gh release download --repo BleuBleu/FamiStudio --pattern '*Linux*' --dir famistudio
          cd famistudio
          for f in *.zip; do unzip -q "$f"; done
          for f in *.tar.gz; do [ -e "$f" ] && tar -xzf "$f"; done
          find . -maxdepth 3 | head -50
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libopenal1 libgl1 > /dev/null
      - name: Export example projects
        run: |
          godot --headless --path . --import < /dev/null
          godot --headless --path . -s tools/nes_examples.gd -- "$PWD/nes_examples" < /dev/null
      - name: Convert them with FamiStudio
        run: |
          set -e
          dll=$(find "$RUNNER_TEMP/tools/famistudio" -name FamiStudio.dll | head -1)
          exe=$(find "$RUNNER_TEMP/tools/famistudio" -type f -name FamiStudio | head -1)
          if [ -n "$dll" ]; then fs() { xvfb-run -a dotnet "$dll" "$@"; }; else chmod +x "$exe"; fs() { xvfb-run -a "$exe" "$@"; }; fi
          fs -help | head -60 || true
          cd nes_examples
          for project in song_*.txt; do
            name="${project%.txt}"
            fs "$project" famistudio-asm-export "$name.s" -famistudio-asm-format:ca65
            fs "$project" nsf-export "$name.nsf"
            fs "$project" rom-export "$name.nes"
            fs "$project" wav-export "$name.wav" -wav-export-duration:8
            for out in "$name.s" "$name.nsf" "$name.nes" "$name.wav"; do
              [ -s "$out" ] || { echo "FamiStudio did not write $out"; exit 1; }
            done
            python3 ../tools/nes_check.py "$name.wav" 4
          done
          fs kit.txt famistudio-asm-sfx-export kit_sfx.s -famistudio-asm-format:ca65
          [ -s kit_sfx.s ] || { echo "FamiStudio did not write kit_sfx.s"; exit 1; }
          ls -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nes-examples
          path: nes_examples/

  sms:
    name: Master System data with PSGlib's tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sverx/PSGlib
          path: psglib
      - name: Install Godot, SDCC and PSGlib's tools
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          sudo apt-get update -qq && sudo apt-get install -y -qq sdcc zlib1g-dev > /dev/null
          src="$GITHUB_WORKSPACE/psglib/tools/src"
          gcc -O2 -o vgm2psg "$src/vgm2psg.c" -lz
          gcc -O2 -o psgcomp "$src/psgcomp.c"
          gcc -O2 -o psgdecomp "$src/psgdecomp.c"
          echo "$RUNNER_TEMP/tools" >> $GITHUB_PATH
          sdcc --version | head -1
      - name: Export example data
        run: |
          godot --headless --path . --import < /dev/null
          godot --headless --path . -s tools/sms_examples.gd -- "$PWD/sms_examples" < /dev/null
      - name: Check it with PSGlib's tools and SDCC
        run: |
          set -e
          cd sms_examples
          for psg in song_*.psg sfx_*.psg; do
            name="${psg%.psg}"
            # PSGlib's own converter, from our VGM of the same song, must
            # give the same chip registers on every frame.
            channels=""
            case "$name" in sfx_*) channels="${name##*_ch}" ;; esac
            vgm2psg "$name.vgm" "$name.vgm2psg.psg" $channels
            # Compressed and decompressed again, it must come back byte for byte.
            psgcomp "$psg" "$name.comp.psg"
            psgdecomp "$name.comp.psg" "$name.decomp.psg"
            cmp "$psg" "$name.decomp.psg"
            python3 ../tools/sms_check.py "$psg" "$name.vgm2psg.psg" "$name.decomp.psg"
          done
          for c in *_psg.c; do
            sdcc -mz80 -c "$c" -o "${c%.c}.rel"
            [ -s "${c%.c}.rel" ] || { echo "SDCC did not compile $c"; exit 1; }
          done
          for wav in *_preview.wav; do
            python3 ../tools/nes_check.py "$wav" 4
          done
          ls -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sms-examples
          path: sms_examples/

  genesis:
    name: Mega Drive example built with SGDK
    runs-on: ubuntu-latest
    env:
      SGDK_IMAGE: ghcr.io/stephane-d/sgdk@sha256:b0bb8a7171f8dcbf1625685b3a839d23c5c32000019a2023d0e039dd6eadcf31
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ValleyBell/libvgm
          path: libvgm
      - name: Install Godot, SGDK, libvgm's vgm2wav and stable-retro
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          cmake -S "$GITHUB_WORKSPACE/libvgm" -B libvgm-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBAUDIO=OFF -DBUILD_PLAYER=OFF -DBUILD_TESTS=OFF -DUSE_SANITIZERS=OFF > /dev/null
          cmake --build libvgm-build -j4 --target vgm2wav > /dev/null
          cp "$(find libvgm-build -name vgm2wav -type f -perm -u+x | head -1)" .
          echo "$RUNNER_TEMP/tools" >> $GITHUB_PATH
          docker pull -q "$SGDK_IMAGE"
          pip install -q stable-retro
      - name: Export the example project
        run: |
          godot --headless --path . --import < /dev/null
          godot --headless --path . -s tools/md_examples.gd -- "$PWD/md_examples" < /dev/null
      - name: Check the songs survive SGDK's XGM conversion
        run: |
          set -e
          cd md_examples
          chmod -R a+rwX .
          for vgm in song_*.vgm; do
            name="${vgm%.vgm}"
            # XGM and back to VGM with SGDK's own tool: the same registers
            # and key-ons on every frame.
            docker run --rm -v "$PWD":/src --entrypoint /sgdk/bin/xgmtool "$SGDK_IMAGE" "/src/$vgm" "/src/$name.xgm"
            docker run --rm -v "$PWD":/src --entrypoint /sgdk/bin/xgmtool "$SGDK_IMAGE" "/src/$name.xgm" "/src/$name.xgm.vgm"
            python3 ../tools/md_check.py "$vgm" "$name.xgm.vgm"
          done
      - name: Build the example ROM with SGDK
        run: |
          set -e
          cd md_examples/project
          docker run --rm -v "$PWD":/src "$SGDK_IMAGE"
          [ -s out/rom.bin ] || { echo "SGDK did not build the ROM"; exit 1; }
          ls -l out/rom.bin
      - name: Play the song with libvgm and the ROM in an emulator
        run: |
          set -e
          cd md_examples
          preview=song_happy_platformer_preview.wav
          # An accurate YM2612 core playing our VGM should rise and fall with
          # the app's own preview.
          vgm2wav --loops 1 song_happy_platformer.vgm libvgm.wav > /dev/null
          python3 ../tools/md_sound_check.py "$preview" libvgm.wav
          # The ROM SGDK built: its Z80 driver playing the XGM data.
          python3 ../tools/md_rom_audio.py project/out/rom.bin rom.wav 16
          python3 ../tools/md_sound_check.py "$preview" rom.wav --align
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-examples
          path: |
            md_examples/*.vgm
            md_examples/*.wav
            md_examples/project/res/
            md_examples/project/src/
            md_examples/project/out/rom.bin

  export:
    name: Export ${{ matrix.preset }}
    needs: [test, gameboy, nes, sms, genesis]
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Web
            path: build/web/index.html
            artifact: chiptune-forge-web
          - preset: Linux
            path: build/linux/chiptune-forge.x86_64
            artifact: chiptune-forge-linux
          - preset: Windows Desktop
            path: build/windows/chiptune-forge.exe
            artifact: chiptune-forge-windows
          - preset: macOS
            path: build/macos/chiptune-forge.zip
            artifact: chiptune-forge-macos
          - preset: Android
            path: build/android/chiptune-forge.apk
            artifact: chiptune-forge-android
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -s /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      # The run number goes up by one on every CI run, so each build gets a
      # bigger number. It shows in the app's header.
      - name: Stamp build number
        run: bash tools/stamp_build.sh "${GITHUB_RUN_NUMBER}"
      # Bundled with Game Boy exports, so users only need GBDK to build.
      - uses: actions/download-artifact@v4
        with:
          name: hugedriver-lib
          path: assets/gameboy/hUGEDriver/lib
      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash tools/stamp_version.sh "${GITHUB_REF_NAME}"
      - name: Android signing
        if: matrix.preset == 'Android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
          mkdir -p ~/.config/godot
          cp /root/.config/godot/editor_settings-4*.tres ~/.config/godot/ 2>/dev/null || true
          # Sign with the release key when the repo has one, else fall back
          # to the debug key.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_USER" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_SIGNING=release" >> $GITHUB_ENV
          else
            echo "ANDROID_SIGNING=debug" >> $GITHUB_ENV
          fi
      - name: Import
        run: godot --headless --path . --import
      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.path }}")"
          if [ "${{ matrix.preset }}" = "Android" ] && [ "$ANDROID_SIGNING" = "debug" ]; then
            godot --headless --path . --export-debug "${{ matrix.preset }}" "${{ matrix.path }}"
          else
            godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.path }}"
          fi
          test -s "${{ matrix.path }}"
          if [ "${{ matrix.preset }}" = "Android" ]; then
            echo "$ANDROID_SIGNING" > build/android/signing.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
          if-no-files-found: error

  pages:
    name: Deploy web build to GitHub Pages
    needs: export
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chiptune-forge-web
          path: site
      # One artifact name per attempt, so "Re-run failed jobs" doesn't find
      # the previous attempt's artifact and refuse to deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/web
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  release:
    name: Publish GitHub Release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package builds
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          # Artifacts lose the executable bit, so restore it before packing.
          chmod +x artifacts/chiptune-forge-linux/linux/chiptune-forge.x86_64
          tar -czf "dist/chiptune-forge-${v}-linux-x86_64.tar.gz" \
            -C artifacts/chiptune-forge-linux/linux chiptune-forge.x86_64
          (cd artifacts/chiptune-forge-windows/windows && \
            zip -q "$GITHUB_WORKSPACE/dist/chiptune-forge-${v}-windows-x86_64.zip" chiptune-forge.exe)
          cp artifacts/chiptune-forge-macos/macos/chiptune-forge.zip \
            "dist/chiptune-forge-${v}-macos.zip"
          cp artifacts/chiptune-forge-android/android/chiptune-forge.apk \
            "dist/chiptune-forge-${v}-android.apk"
          (cd artifacts/chiptune-forge-web/web && \
            zip -qr "$GITHUB_WORKSPACE/dist/chiptune-forge-${v}-web.zip" .)
          signing=$(cat artifacts/chiptune-forge-android/android/signing.txt)
          bash tools/release_notes.sh "$v" "$signing" > notes.md
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run replaces the files on the release it already made.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Chiptune Forge ${GITHUB_REF_NAME}" \
            --notes-file notes.md --verify-tag $flags
